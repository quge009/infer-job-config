model:
  name: "Mixtral 8x7B Instruct v0.1"
  family: "mistral"
  size: "8x7b"
  hf_model_id: "mistralai/Mixtral-8x7B-Instruct-v0.1"
  hf_revision: "main"

hardware:
  min_gpus: 2
  gpu_memory_gb: 80
  recommended_gpu: "A100-80GB"

inference:
  dtype: "bfloat16"
  max_model_len: 32768
  max_num_seqs: 128
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  quantization: null

vllm:
  block_size: 16
  gpu_memory_utilization: 0.90
  swap_space: 8
  disable_chunked_prefill: false
  enforce_eager: false

tgi:
  max_batch_total_tokens: 65536
  max_new_tokens: 4096
  max_total_tokens: 32768
  max_concurrent_requests: 64
  max_waiting_tokens: 20
  num_shard: 2

resources:
  requests:
    cpu: "8"
    memory: "80Gi"
    nvidia.com/gpu: "2"
  limits:
    cpu: "16"
    memory: "160Gi"
    nvidia.com/gpu: "2"
  image: "vllm/vllm-openai:latest"
  image_pull_policy: "IfNotPresent"

serving:
  host: "0.0.0.0"
  port: 8000
  api_base_path: "/v1"
  api_key: null
  log_requests: false
