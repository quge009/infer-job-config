model:
  name: "LLaMA-3 8B"
  family: "llama"
  size: "8b"
  hf_model_id: "meta-llama/Meta-Llama-3-8B"
  hf_revision: "main"

hardware:
  min_gpus: 1
  gpu_memory_gb: 20
  recommended_gpu: "A10G-24GB"

inference:
  dtype: "bfloat16"
  max_model_len: 8192
  max_num_seqs: 256
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  quantization: null

vllm:
  block_size: 16
  gpu_memory_utilization: 0.90
  swap_space: 4
  disable_chunked_prefill: false
  enforce_eager: false

tgi:
  max_batch_total_tokens: 32768
  max_new_tokens: 4096
  max_total_tokens: 8192
  max_concurrent_requests: 128
  max_waiting_tokens: 20
  num_shard: 1

resources:
  requests:
    cpu: "4"
    memory: "24Gi"
    nvidia.com/gpu: "1"
  limits:
    cpu: "8"
    memory: "48Gi"
    nvidia.com/gpu: "1"
  image: "vllm/vllm-openai:latest"
  image_pull_policy: "IfNotPresent"

serving:
  host: "0.0.0.0"
  port: 8000
  api_base_path: "/v1"
  api_key: null
  log_requests: false
