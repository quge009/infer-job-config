model:
  name: "Qwen2 72B Instruct"
  family: "qwen"
  size: "72b"
  hf_model_id: "Qwen/Qwen2-72B-Instruct"
  hf_revision: "main"

hardware:
  min_gpus: 4
  gpu_memory_gb: 80
  recommended_gpu: "A100-80GB"

inference:
  dtype: "bfloat16"
  max_model_len: 131072
  max_num_seqs: 32
  tensor_parallel_size: 4
  pipeline_parallel_size: 1
  quantization: null

vllm:
  block_size: 16
  gpu_memory_utilization: 0.92
  swap_space: 16
  disable_chunked_prefill: false
  enforce_eager: false

tgi:
  max_batch_total_tokens: 262144
  max_new_tokens: 8192
  max_total_tokens: 131072
  max_concurrent_requests: 16
  max_waiting_tokens: 20
  num_shard: 4

resources:
  requests:
    cpu: "16"
    memory: "320Gi"
    nvidia.com/gpu: "4"
  limits:
    cpu: "32"
    memory: "640Gi"
    nvidia.com/gpu: "4"
  image: "vllm/vllm-openai:latest"
  image_pull_policy: "IfNotPresent"

serving:
  host: "0.0.0.0"
  port: 8000
  api_base_path: "/v1"
  api_key: null
  log_requests: false
