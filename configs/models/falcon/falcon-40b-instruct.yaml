model:
  name: "Falcon 40B Instruct"
  family: "falcon"
  size: "40b"
  hf_model_id: "tiiuae/falcon-40b-instruct"
  hf_revision: "main"

hardware:
  min_gpus: 2
  gpu_memory_gb: 80
  recommended_gpu: "A100-80GB"

inference:
  dtype: "bfloat16"
  max_model_len: 8192
  max_num_seqs: 64
  tensor_parallel_size: 2
  pipeline_parallel_size: 1
  quantization: null

vllm:
  block_size: 16
  gpu_memory_utilization: 0.90
  swap_space: 8
  disable_chunked_prefill: false
  enforce_eager: false

tgi:
  max_batch_total_tokens: 16384
  max_new_tokens: 2048
  max_total_tokens: 8192
  max_concurrent_requests: 32
  max_waiting_tokens: 20
  num_shard: 2

resources:
  requests:
    cpu: "8"
    memory: "80Gi"
    nvidia.com/gpu: "2"
  limits:
    cpu: "16"
    memory: "160Gi"
    nvidia.com/gpu: "2"
  image: "vllm/vllm-openai:latest"
  image_pull_policy: "IfNotPresent"

serving:
  host: "0.0.0.0"
  port: 8000
  api_base_path: "/v1"
  api_key: null
  log_requests: false
