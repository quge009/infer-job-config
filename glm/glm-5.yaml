protocolVersion: 2
name: glm-inf-engine
type: job
jobRetryCount: 0
prerequisites:
  - type: dockerimage
    uri: 'lmsysorg/sglang:dev-cu13-glm5-gb-testing'
    name: sglang_glm_image
taskRoles:
  inference:
    instances: 1
    dockerImage: sglang_glm_image
    extraContainerOptions:
      shmMB: 524288
      infiniband: true
    resourcePerInstance:
      gpu: 8
      cpu: 240
      memoryMB: 3072000
    commands:
      - export DEBIAN_FRONTEND=noninteractive
      - curl -fsSL http://10.100.197.13/user_config/bootstrap.sh | bash -s -- --all
      - apt-get update && apt-get install -y --allow-unauthenticated libibverbs1 rdma-core ibverbs-utils libsnappy1v5 jq
      
      - >-
        curl -fsSL http://10.100.197.13/3fs/install.sh | bash -s --  --token "<% $secrets.HF3FS_TOKEN %>" --no-systemd
      - sleep 30
      
      - >-
        python3 -m sglang.launch_server
        --model-path /mnt/3fs/data/leiqu/data/models/zai-org/GLM-5/GLM-5
        --served-model-name glm-5
        --port 8088
        --host 0.0.0.0
        --tp 8
        --trust-remote-code
        --mem-fraction-static 0.9
        --reasoning-parser deepseek-r1
        --tool-call-parser glm47
